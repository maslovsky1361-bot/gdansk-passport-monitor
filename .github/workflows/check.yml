name: Gdansk passport queue monitor

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdansk-passport-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check Gdansk queue
        run: python check_queue.py

      - name: Save current status
        if: always()
        run: |
          git config user.name "queue-monitor"
          git config user.email "queue-monitor@users.noreply.github.com"

          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Gdansk queue status"
            git pull --rebase
            git push
          fi
